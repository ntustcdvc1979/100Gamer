<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#FAF6EA">
<title>加入遊戲</title>
<meta name="robots" content="noindex">
</head>
<body class="app">

<section class="screen" id="joinScreen">
  <h1>加入遊戲</h1>
  <p class="lede">輸入一個名字，暱稱就好。</p>
  <input id="name" class="name" type="text" maxlength="8" placeholder="你的名字"
         autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
  <button class="btn" id="joinBtn" disabled>加入</button>
  <p class="hint" id="joinHint">連線中…</p>
</section>

<section class="screen" id="playScreen" hidden>
  <header class="me">
    <div class="team" id="teamName">—</div>
    <div class="who" id="myName">—</div>
  </header>

  <!-- 現在要幹嘛。後排看不到投影幕，就看這一行。 -->
  <p class="say" id="say"></p>

  <!-- 沒有輪到操作的時候。搖桿不是預設值。 -->
  <div class="pane" id="idlePane">
    <div class="waiting">✦</div>
    <p class="paneHint">看投影幕，等主持人</p>
  </div>

  <!-- 搖桿 -->
  <div class="pad" id="pad" hidden>
    <div class="quads" id="quads" hidden>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="knob" id="knob"></div>
    <p class="padHint" id="padHint">按住並移動</p>
  </div>

  <!-- 拍照找顏色。可以重拍，只能上傳一次。 -->
  <div class="pane" id="camPane" hidden>
    <p class="paneLabel">要找的顏色</p>
    <div class="swatch big" id="camTarget"></div>

    <label class="btn shotBtn" id="shotLabel">
      📷 拍照（可以重拍）
      <input type="file" id="shot" accept="image/*" capture="environment" hidden>
    </label>

    <div class="result">
      <img id="camPreview" alt="剛剛拍到的畫面" hidden>
      <div class="swatch" id="camSwatch" hidden></div>
    </div>

    <button class="btn" id="sendShot" hidden>就是這張，上傳</button>
    <p class="paneHint" id="camHint"></p>
    <p class="fine">只能上傳一次，上傳後不能換。<b>這張照片會投在大螢幕上給全場看。</b></p>
  </div>

  <!-- 火候達人：翻面或起鍋 -->
  <div class="pane" id="motionPane" hidden>
    <p class="paneLabel" id="motionVerb">把手機翻面</p>
    <div class="bigNum" id="motionTarget">—</div>
    <button class="btn ghost" id="armBtn">開啟感測器</button>
    <button class="btn" id="actBtn" disabled>翻面！</button>
    <p class="paneHint" id="motionHint"></p>
    <p class="fine" id="motionFine">手機螢幕朝上放好，時間到翻過來。感測器不能用就按上面的按鈕。</p>
  </div>
</section>

<div class="status" id="status"><span class="dot"></span><span id="statusText">連線中…</span></div>

<script type="module" src="/src/play/main.ts"></script>
</body>
</html>
