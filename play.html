<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#FAF6EA">
<title>加入遊戲</title>
<meta name="robots" content="noindex">
</head>
<body class="app">

<section class="screen" id="joinScreen">
  <h1>加入遊戲</h1>
  <p class="lede">輸入名字，然後選一隊。</p>
  <input id="name" class="name" type="text" maxlength="8" placeholder="你的名字"
         autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
  <div class="teams" id="teams"></div>
  <button class="btn" id="joinBtn" disabled>加入</button>
  <p class="hint" id="joinHint"></p>
</section>

<section class="screen" id="playScreen" hidden>
  <header class="me">
    <div class="team" id="teamName">—</div>
    <div class="who" id="myName">—</div>
  </header>

  <p class="say" id="say"></p>
  <p class="sensor" id="sensor" hidden></p>

  <!-- 沒輪到操作 -->
  <div class="pane" id="idlePane">
    <div class="waiting">✦</div>
    <p class="paneHint">看投影幕，等主持人</p>
  </div>

  <!-- 搖桿 -->
  <div class="pad" id="pad" hidden>
    <div class="quads" id="quads" hidden>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="knob" id="knob"></div>
    <p class="padHint" id="padHint">按住並移動</p>
  </div>

  <!-- 拍照找顏色 -->
  <div class="pane" id="camPane" hidden>
    <p class="paneLabel">要找的顏色</p>
    <div class="swatch big" id="camTarget"></div>
    <label class="btn shotBtn" id="shotLabel">
      📷 拍照（可以重拍）
      <input type="file" id="shot" accept="image/*" capture="environment" hidden>
    </label>
    <div class="result">
      <img id="camPreview" alt="剛剛拍到的畫面" hidden>
      <div class="swatch" id="camSwatch" hidden></div>
    </div>
    <button class="btn" id="sendShot" hidden>就是這張，上傳</button>
    <p class="paneHint" id="camHint"></p>
    <p class="fine">只能上傳一次。<b>這張照片會投在大螢幕上給全場看。</b></p>
  </div>

  <!-- 火候達人 -->
  <div class="pane" id="motionPane" hidden>
    <p class="paneLabel" id="motionVerb">把手機翻面</p>
    <div class="bigNum" id="motionTarget">—</div>
    <!-- 這裡刻意沒有「開啟感測器」按鈕：權限在加入遊戲那一下就要好了。
         感測器不能用的人直接按下面那顆動作鈕，比多一顆按鈕好懂。 -->
    <button class="btn" id="actBtn" disabled>翻面！</button>
    <p class="paneHint" id="motionHint"></p>
    <p class="fine" id="motionFine">手機螢幕朝上放好，時間到翻過來。</p>
    <p class="fine">螢幕關掉就偵測不到了，別鎖屏。</p>
  </div>

  <!-- 搖手機 -->
  <div class="pane" id="shakePane" hidden>
    <div class="shakeBig" id="shakeBig">🫨</div>
    <div class="bigNum" id="shakeCount">0</div>
    <p class="paneLabel" id="shakeVerb">用力搖手機！</p>
    <!-- 搖動關卡沒有動作鈕可以代替（按鈕比搖手機快太多，等於開一條作弊路）。
         所以這裡留一顆重新要權限的按鈕當最後手段，感測器正常時會自己收起來。 -->
    <button class="btn ghost" id="armBtn2" hidden>重新開啟感測器</button>
    <p class="fine">這一關一定要用搖的，沒有按鈕可以代替。<br>螢幕關掉就不會計數了，把手機拿著別鎖屏。</p>
  </div>

  <!-- 地理達人 -->
  <div class="pane" id="tapPane" hidden>
    <p class="paneLabel" id="tapPlace">—</p>
    <div class="map" id="map"></div>
    <p class="paneHint" id="tapHint">在地圖上點一下</p>
  </div>

  <!-- 文字找不同 -->
  <div class="pane" id="findPane" hidden>
    <p class="paneLabel">找出不一樣的那一個</p>
    <div class="findGrid" id="findGrid"></div>
    <p class="paneHint" id="findHint"></p>
  </div>
</section>

<div class="status" id="status"><span class="dot"></span><span id="statusText">連線中…</span></div>

<script type="module" src="/src/play/main.ts"></script>
</body>
</html>
